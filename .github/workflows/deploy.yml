name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; a queued run cancels any in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build
        run: |
          npm run build
          # Copy index.html to 404.html so GitHub Pages serves the SPA
          # instead of a plain 404 when users navigate directly to a route.
          cp dist/index.html dist/404.html
        working-directory: .
        env:
          # Set in: Settings → Secrets and variables → Actions → Variables
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          # Must match the repository name for GitHub Pages project sites.
          VITE_BASE_PATH: /personal-budget-maker

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
